<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StrategyLive</title>
    <style>
      body {
        font-family: system-ui, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        background: linear-gradient(135deg, rgba(15,15,20,0.95), rgba(25,25,35,0.95));
        color: #fff;
        width: 280px;
        min-height: 160px;
        box-sizing: border-box;
      }
      .header {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #A0C8F0;
        text-align: center;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.2);
        cursor: pointer;
        flex: 1;
        transition: all 0.2s ease;
      }
      .start-btn {
        background: linear-gradient(135deg, #4A90E2, #357ABD);
        color: #fff;
      }
      .start-btn:hover {
        background: linear-gradient(135deg, #357ABD, #2E6DA4);
        box-shadow: 0 2px 8px rgba(74, 144, 226, 0.4);
      }
      .stop-btn {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
        color: #fff;
      }
      .stop-btn:hover {
        background: linear-gradient(135deg, #c0392b, #a93226);
        box-shadow: 0 2px 8px rgba(231, 76, 60, 0.4);
      }
      .test-btn {
        background: rgba(60, 60, 70, 0.8);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
      }
      .test-btn:hover {
        background: rgba(70, 70, 80, 0.9);
      }
      #status {
        font-size: 11px;
        opacity: 0.9;
        background: rgba(25, 45, 65, 0.6);
        padding: 8px;
        border-radius: 6px;
        border: 1px solid rgba(100, 150, 200, 0.3);
        margin-bottom: 8px;
        text-align: center;
      }
      #health-status {
        font-size: 10px;
        opacity: 0.7;
        text-align: center;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="header">StrategyLive Assistant</div>
    <div id="status">Idle</div>
    <div class="controls">
      <button id="start" class="start-btn">Start</button>
      <button id="stop" class="stop-btn">Stop</button>
    </div>
    <button id="test-health" class="test-btn">Test Health</button>
    <div id="health-status"></div>
    <script src="popup.js"></script>
  </body>
  </html>
